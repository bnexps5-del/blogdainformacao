<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Versão móvel | Blog da Informação</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1ee;font:14px Arial,sans-serif;color:#183722}header{padding:17px 22px;background:white;border-bottom:1px solid #d6e1d8;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}strong{font-size:18px}strong span{color:#11883f}p{margin:6px 0 0;color:#66736a;font-size:12px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;min-height:42px;border:1px solid #cbd9ce;background:white;border-radius:6px;padding:9px 13px;color:#23442c}button{cursor:pointer}button[aria-pressed=true]{background:#11883f;border-color:#11883f;color:white}main{padding:25px 12px;display:flex;justify-content:center}.phone{box-sizing:content-box;width:390px;max-width:100%;border:7px solid #19271e;border-radius:25px;overflow:hidden;box-shadow:0 16px 40px #13271824;background:white}.status{height:26px;background:#19271e;color:white;text-align:center;font-size:10px;letter-spacing:1px;padding-top:6px}iframe{display:block;border:0;width:100%;height:min(790px,calc(100dvh - 180px));min-height:400px;background:white}a{color:#11883f;text-decoration:none;font-size:12px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #12883f;outline-offset:3px}@media(max-width:500px){header{padding:14px 16px;gap:13px}.controls{gap:6px}button,select{font-size:12px;padding:8px 10px}main{padding:15px 8px}.phone{border-width:4px;border-radius:16px}iframe{height:calc(100dvh - 190px)}select{max-width:195px}}</style></head><body><header><div><strong>Blog da Informação<span>↗</span> · Versão móvel</strong><p>Role dentro da tela para explorar a página.</p></div><div class="controls"><label for="story">Página:</label><select id="story"><option value="primeira-cnh-aos-18">18 anos</option><option value="entregador">Entregador</option><option value="mulher-onibus">Mulher no ônibus</option><option value="pais-primeira-cnh">Pais e filhos</option><option value="gastos-com-transporte">Gastos com transporte</option></select><button data-width="360" aria-pressed="false">360 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430" aria-pressed="false">430 px</button><a id="full" href="/historias/primeira-cnh-aos-18/">Abrir página ↗</a></div></header><main><div class="phone"><div class="status">PRÉVIA · 390 PX</div><iframe title="Blog da Informação em largura de celular" src="/historias/primeira-cnh-aos-18/"></iframe></div></main><script>const frame=document.querySelector('iframe'),phone=document.querySelector('.phone');document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{phone.style.width=b.dataset.width+'px';document.querySelector('.status').textContent='PRÉVIA · '+b.dataset.width+' PX';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));document.querySelector('#story').addEventListener('change',e=>{const path='/historias/'+e.target.value+'/';frame.src=path;document.querySelector('#full').href=path});</script></body></html>
