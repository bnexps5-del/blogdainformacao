[build]
  publish = "public"
  command = "npm run check"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/adminx"
  to = "/admin/index.html"
  status = 200
[[redirects]]
  from = "/adminx/*"
  to = "/admin/:splat"
  status = 200
[[headers]]
  for = "/adminx*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
